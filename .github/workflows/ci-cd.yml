name: E-Commerce Microservices CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build all microservices using Maven
      - name: Build all microservices
        run: |
          for service in api-gateway auth-service cart-service eureka-server notification-service order-service payment-service product-service
          do
            echo "Building $service"
            cd "$GITHUB_WORKSPACE/$service"
            mvn clean package -DskipTests
          done

      # 4. Check GitHub OIDC context
      - name: Check GitHub OIDC context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Event: $GITHUB_EVENT_NAME"

      # 5. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::087670584144:role/GitHubActions-ECR-EKS-Role
          aws-region: ap-south-2

      # 6. Create ECR repositories if they do not exist
      - name: Create ECR repositories
        run: |
          for service in api-gateway auth-service cart-service eureka-server notification-service order-service payment-service product-service
          do
            echo "Checking ECR repository: $service"

            aws ecr describe-repositories \
              --repository-names "$service" \
              --region ap-south-2 \
              > /dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "$service" \
              --region ap-south-2
          done

      # 7. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 8. Build and push Docker images to ECR
      - name: Build and push Docker images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for service in api-gateway auth-service cart-service eureka-server notification-service order-service payment-service product-service
          do
            echo "Building Docker image for $service"

            docker build \
              -t "$REGISTRY/$service:$IMAGE_TAG" \
              "./$service"

            echo "Pushing $service image to ECR"

            docker push "$REGISTRY/$service:$IMAGE_TAG"
          done

      # 9. Setup kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      # 10. Configure kubectl for EKS
      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region ap-south-2 \
            --name ecommerce-dev-eks

      # 11. Verify EKS connectivity
      - name: Verify EKS cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      # 12. Create ecommerce namespace
      - name: Create ecommerce namespace
        run: |
          kubectl apply -f kubernetes/namespace.yaml

      # 13. Create Kubernetes Secret from GitHub Secrets
      - name: Create ecommerce Kubernetes Secret
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
        run: |
          kubectl create secret generic ecommerce-secrets \
            --namespace ecommerce \
            --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            --from-literal=STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            --from-literal=STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY" \
            --from-literal=GMAIL_USERNAME="$GMAIL_USERNAME" \
            --from-literal=GMAIL_PASSWORD="$GMAIL_PASSWORD" \
            --from-literal=TWILIO_ACCOUNT_SID="$TWILIO_ACCOUNT_SID" \
            --from-literal=TWILIO_AUTH_TOKEN="$TWILIO_AUTH_TOKEN" \
            --from-literal=TWILIO_PHONE_NUMBER="$TWILIO_PHONE_NUMBER" \
            --from-literal=TWILIO_WHATSAPP_NUMBER="$TWILIO_WHATSAPP_NUMBER" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # 14. Update Kubernetes image tags with the Git commit SHA
      - name: Update Kubernetes image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          find kubernetes -name "*.yaml" \
            ! -name "namespace.yaml" \
            ! -name "secrets.yaml" \
            -type f \
            -exec sed -i "s/:latest/:${IMAGE_TAG}/g" {} +

      # 15. Deploy Kubernetes manifests
      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f kubernetes/

      # 16. Wait for application rollouts
      - name: Wait for application rollouts
        run: |
          kubectl rollout status deployment/mysql -n ecommerce --timeout=180s
          kubectl rollout status deployment/kafka -n ecommerce --timeout=180s
          kubectl rollout status deployment/eureka-server -n ecommerce --timeout=180s
          kubectl rollout status deployment/api-gateway -n ecommerce --timeout=180s
          kubectl rollout status deployment/auth-service -n ecommerce --timeout=180s
          kubectl rollout status deployment/product-service -n ecommerce --timeout=180s
          kubectl rollout status deployment/cart-service -n ecommerce --timeout=180s
          kubectl rollout status deployment/order-service -n ecommerce --timeout=180s
          kubectl rollout status deployment/payment-service -n ecommerce --timeout=180s
          kubectl rollout status deployment/notification-service -n ecommerce --timeout=180s

      # 17. Display deployment status
      - name: Verify Kubernetes deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ecommerce

          echo "=== Services ==="
          kubectl get services -n ecommerce

          echo "=== Deployments ==="
          kubectl get deployments -n ecommerce
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecommerce
  labels:
    app: notification-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-service
          image: 087670584144.dkr.ecr.ap-south-2.amazonaws.com/notification-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8088

          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"

            - name: SPRING_MAIL_HOST
              value: "smtp.gmail.com"

            - name: SPRING_MAIL_PORT
              value: "587"

            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: GMAIL_USERNAME

            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: GMAIL_PASSWORD

            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: TWILIO_ACCOUNT_SID

            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: TWILIO_AUTH_TOKEN

            - name: TWILIO_PHONE_NUMBER
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: TWILIO_PHONE_NUMBER

            - name: TWILIO_WHATSAPP_NUMBER
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: TWILIO_WHATSAPP_NUMBER

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "500m"
              memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecommerce
  labels:
    app: notification-service

spec:
  selector:
    app: notification-service

  ports:
    - name: http
      port: 8088
      targetPort: 8088

  type: ClusterIP
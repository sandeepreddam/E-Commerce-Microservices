apiVersion: apps/v1
kind: Deployment
metadata:
name: eureka-server
namespace: ecommerce
labels:
app: eureka-server
spec:
replicas: 1
selector:
matchLabels:
app: eureka-server
template:
metadata:
labels:
app: eureka-server
spec:
containers:
- name: eureka-server
image: 087670584144.dkr.ecr.ap-south-2.amazonaws.com/eureka-server:latest
imagePullPolicy: Always
ports:
- containerPort: 8761
resources:
requests:
cpu: "250m"
memory: "512Mi"
limits:
cpu: "500m"
memory: "1Gi"

---

apiVersion: v1
kind: Service
metadata:
name: eureka-server
namespace: ecommerce
spec:
selector:
app: eureka-server
ports:
- name: http
port: 8761
targetPort: 8761
type: ClusterIP
